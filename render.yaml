services:
  - type: web
    name: ip-lookup
    env: go
    buildCommand: go build -o server
    startCommand: ./server
    envVars:
      - key: PORT
        value: 8080
      - key: VT_API_KEY
        sync: false
      - key: ABUSE_API_KEY
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: IPLOCATE_API_KEY
        sync: false

