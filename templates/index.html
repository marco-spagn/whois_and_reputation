<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Lookup & Reputation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #2a2a3e;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #fff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 5px;
            background: #1a1a2e;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4a9eff;
        }
        button {
            padding: 12px 30px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-bottom: 20px;
        }
        button:hover {
            background: #3a8eef;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .spinner {
            display: none;
            text-align: center;
            color: #4a9eff;
            margin: 20px 0;
        }
        .spinner.active {
            display: block;
        }
        .output {
            display: none;
            margin-top: 20px;
        }
        .output.active {
            display: block;
        }
        .output-content {
            background: #1a1a2e;
            border: 2px solid #444;
            border-radius: 5px;
            padding: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .copy-btn {
            background: #28a745;
            width: auto;
            padding: 10px 20px;
            margin-bottom: 0;
        }
        .copy-btn:hover {
            background: #218838;
        }
        .copy-btn.copied {
            background: #155724;
        }
        .error {
            color: #ff6b6b;
            background: #3a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 IP Lookup & Reputation</h1>
        
        <form id="lookupForm">
            <div class="form-group">
                <label for="ipInput">Indirizzo IP:</label>
                <input 
                    type="text" 
                    id="ipInput" 
                    name="ip" 
                    placeholder="Es: 8.8.8.8 o 2a0d:5600:8:101:0:1:7b8f:7c91"
                    required
                    autofocus
                >
            </div>
            <button type="submit" id="searchBtn">Cerca</button>
        </form>

        <div class="spinner" id="spinner">
            ⏳ Recupero informazioni...
        </div>

        <div class="error" id="error"></div>

        <div class="output" id="output">
            <div class="output-content" id="outputContent"></div>
            <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">📋 Copia</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('lookupForm');
        const ipInput = document.getElementById('ipInput');
        const searchBtn = document.getElementById('searchBtn');
        const spinner = document.getElementById('spinner');
        const output = document.getElementById('output');
        const outputContent = document.getElementById('outputContent');
        const errorDiv = document.getElementById('error');
        const copyBtn = document.getElementById('copyBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ip = ipInput.value.trim();
            if (!ip) {
                showError('Inserisci un indirizzo IP valido');
                return;
            }

            // Nascondi output ed errori precedenti
            output.classList.remove('active');
            errorDiv.classList.remove('active');
            
            // Mostra spinner e disabilita pulsante
            spinner.classList.add('active');
            searchBtn.disabled = true;

            try {
                const response = await fetch(`/lookup?ip=${encodeURIComponent(ip)}`);
                const text = await response.text();

                if (!response.ok) {
                    showError(text || 'Errore nella richiesta');
                } else {
                    showOutput(text);
                }
            } catch (error) {
                showError(`Errore di connessione: ${error.message}`);
            } finally {
                spinner.classList.remove('active');
                searchBtn.disabled = false;
            }
        });

        function showOutput(text) {
            outputContent.textContent = text;
            output.classList.add('active');
            errorDiv.classList.remove('active');
            // Scrolla fino all'output
            output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            output.classList.remove('active');
        }

        function copyToClipboard() {
            const text = outputContent.textContent;
            
            // Usa la Clipboard API se disponibile
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.textContent = '✅ Copiato!';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = '📋 Copia';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }).catch(err => {
                    console.error('Errore nella copia:', err);
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            // Metodo alternativo per browser più vecchi
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyBtn.textContent = '✅ Copiato!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copia';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Errore nella copia:', err);
                alert('Errore nella copia. Seleziona il testo manualmente.');
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
