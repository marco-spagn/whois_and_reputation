<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Lookup & Reputation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #2a2a3e;
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #fff;
            text-align: center;
            font-size: 2em;
            flex: 1;
        }
        .logout-btn {
            background: #dc3545;
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            margin: 0;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 5px;
            background: #1a1a2e;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4a9eff;
        }
        button {
            padding: 12px 30px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-bottom: 20px;
        }
        button:hover {
            background: #3a8eef;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .spinner {
            display: none;
            text-align: center;
            color: #4a9eff;
            margin: 20px 0;
        }
        .spinner.active {
            display: block;
        }
        .output {
            display: none;
            margin-top: 20px;
        }
        .output.active {
            display: block;
        }
        .output-section {
            margin-bottom: 20px;
        }
        .output-section h3 {
            color: #4a9eff;
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .output-content {
            background: #1a1a2e;
            border: 2px solid #444;
            border-radius: 5px;
            padding: 20px;
            color: #fff;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .copy-btn {
            background: #28a745;
            width: auto;
            padding: 10px 20px;
            margin-bottom: 0;
        }
        .copy-btn:hover {
            background: #218838;
        }
        .copy-btn.copied {
            background: #155724;
        }
        .error {
            color: #ff6b6b;
            background: #3a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 IP Lookup & Reputation</h1>
            <a href="/logout" class="logout-btn" style="text-decoration: none; color: white; display: inline-block;">Logout</a>
        </div>
        
        <form id="lookupForm">
            <div class="form-group">
                <label for="ipInput">Indirizzo IP:</label>
                <input 
                    type="text" 
                    id="ipInput" 
                    name="ip" 
                    placeholder="Es: 8.8.8.8 o 2a0d:5600:8:101:0:1:7b8f:7c91"
                    required
                    autofocus
                >
            </div>
            <button type="submit" id="searchBtn">Cerca</button>
        </form>

        <div class="spinner" id="spinner">
            ⏳ Recupero informazioni...
        </div>

        <div class="error" id="error"></div>

        <div class="output" id="output">
            <div class="output-section">
                <h3>Standard (WHOIS & Reputation)</h3>
                <div class="output-content" id="outputStandard"></div>
                <button class="copy-btn" id="copyBtnStandard" onclick="copyToClipboard('outputStandard', 'copyBtnStandard')">📋 Copia</button>
            </div>
            <div class="output-section">
                <h3>Extended (with Threat Intelligence)</h3>
                <div class="output-content" id="outputExtended"></div>
                <button class="copy-btn" id="copyBtnExtended" onclick="copyToClipboard('outputExtended', 'copyBtnExtended')">📋 Copia</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('lookupForm');
        const ipInput = document.getElementById('ipInput');
        const searchBtn = document.getElementById('searchBtn');
        const spinner = document.getElementById('spinner');
        const output = document.getElementById('output');
        const outputStandard = document.getElementById('outputStandard');
        const outputExtended = document.getElementById('outputExtended');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ip = ipInput.value.trim();
            if (!ip) {
                showError('Inserisci un indirizzo IP valido');
                return;
            }

            output.classList.remove('active');
            errorDiv.classList.remove('active');
            spinner.classList.add('active');
            searchBtn.disabled = true;

            try {
                const response = await fetch(`/lookup?ip=${encodeURIComponent(ip)}&format=json`);
                const contentType = response.headers.get('content-type') || '';

                if (!response.ok) {
                    const text = await response.text();
                    showError(text || 'Errore nella richiesta');
                    return;
                }

                if (contentType.includes('application/json')) {
                    const data = await response.json();
                    showOutput(data.standard, data.extended);
                } else {
                    const text = await response.text();
                    showOutput(text, text);
                }
            } catch (error) {
                showError(`Errore di connessione: ${error.message}`);
            } finally {
                spinner.classList.remove('active');
                searchBtn.disabled = false;
            }
        });

        function showOutput(standard, extended) {
            outputStandard.textContent = standard;
            outputExtended.textContent = extended;
            output.classList.add('active');
            errorDiv.classList.remove('active');
            output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            output.classList.remove('active');
        }

        function copyToClipboard(contentId, btnId) {
            const contentEl = document.getElementById(contentId);
            const btnEl = document.getElementById(btnId);
            const text = contentEl.textContent;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    btnEl.textContent = '✅ Copiato!';
                    btnEl.classList.add('copied');
                    setTimeout(() => {
                        btnEl.textContent = '📋 Copia';
                        btnEl.classList.remove('copied');
                    }, 2000);
                }).catch(err => {
                    fallbackCopy(text, btnEl);
                });
            } else {
                fallbackCopy(text, btnEl);
            }
        }

        function fallbackCopy(text, btnEl) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                btnEl.textContent = '✅ Copiato!';
                btnEl.classList.add('copied');
                setTimeout(() => {
                    btnEl.textContent = '📋 Copia';
                    btnEl.classList.remove('copied');
                }, 2000);
            } catch (err) {
                alert('Errore nella copia. Seleziona il testo manualmente.');
            }
            document.body.removeChild(textarea);
        }
    </script>
</body>
</html>
